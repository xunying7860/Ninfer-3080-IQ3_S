# /etc/systemd/system/ninfer.service.d/10-slot-sidecar.conf   （2026-10-12 已装到 x99 并实测；回退=删本文件 + daemon-reload）
# 目的：让"重启不重算"覆盖 systemd 发起的重启（含看门狗的 systemctl restart）。
# 用法（等你定产之后）：
#   sudo mkdir -p /etc/systemd/system/ninfer.service.d
#   sudo cp ninfer-slot-sidecar-dropin.conf /etc/systemd/system/ninfer.service.d/10-slot-sidecar.conf
#   sudo systemctl daemon-reload && systemctl restart ninfer        # 重启才生效，且要走一遍门禁
# 168K 会话的一次 save 实测 117.1 s（快照 3,283,941,800 B）⇒ 原来的 TimeoutStopSec=120 会把存盘砍在半路，抬到 300。
[Service]
# 停机前先存：引擎自己不会存（2026-10-12 实测：不先存就 SIGTERM ⇒ save 根本不会发生）
# 这台 systemd 没有 ExecStopPre（systemd-analyze verify: "Unknown key name 'ExecStopPre' … ignoring"），
# 实测只能挂 ExecStop：临时单元实验证明 ExecStop 在 SIGTERM 之前跑完（差 −1.004 s），
# 而 TimeoutStopSec 把 ExecStop 的时间算进去（TimeoutStopSec=4 的单元里 8 s 的 ExecStop 被中途砍）。
# 钩子脚本自己保证永远 exit 0（存不上也不能卡停机）：脚本本体 work/panel-watchdog/stop-save-hook.sh
ExecStop=/bin/bash /data/ninfer/test/stop-save-hook.sh
# 168K 会话的一次 save 实测 117.1 s（快照 3,283,941,800 B）；现在 TimeoutStopSec=120 只剩 3 s 余量 ⇒ 抬到 300
TimeoutStopSec=300
# 恢复（action=restore）不适合放在 ExecStartPost：那时引擎刚起、slot 还是空的，而快照恢复要和
# "会话真正被用起来"绑在一起。两条可选路：
#   A) 常驻 sidecar 守护（window.sh 的 SIDE_DAEMON=1 那种）——但 2026-10-12 实测轮询恢复会跟在途请求挤
#      （restore_ms 19.4–19.8 s）且晚到的恢复是白干（slot 已被新会话占），只能当兜底；
#   B) 交给 serving 层/provider 插件在"该会话的第一条请求"前懒恢复（推荐，逐会话精确、不抢容量）。
# 恢复这条今天**没有**在实产上生效（生产还是厂商件，压根没有 slot 持久化；实测它在 ExecStop 里走的是
# "这条线没开 ⇒ 不动作"分支）。切到 master 线之后，这套钩子才真正开始存东西 —— 那时要先在测试窗口
# 按 §4.6 的门禁重跑一遍再上实产。
