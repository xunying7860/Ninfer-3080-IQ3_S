[Service]
# 512K 档（2026-10-09 用户定案）：逻辑上下文 512K + KVMem 环 + YaRN
#   逻辑上下文 524288（= 2× 原生 262144；--rope-yarn 让引擎自动取 factor = ctx/native = 2.0）
#   设备池 **158,720 token（2,480 页）**· 窗口 **16,384（256 页）**· 检索 8,192（128 页）
#     —— 2026-10-09 14:43 "尽量吃满显存"探边界结果（DSS=10 时）：
#        池 2,400 页 → free 995.7 MiB ✓ 起得来；2,480 页 → free 907.7 MiB ✓（当前，GPU0 96.4%）
#        硬底在 ~837 MiB：实测 free 837 MiB 时 warmup `cudaMalloc` OOM ⇒ 只剩 ~70 MiB 可挤，不值得再试
#        （每 80 页 ≈ 5,120 token 安全题面区，代价是重启 2.5 分钟 + 有 OOM 风险）
#     —— ★ 窗口必须保持小：2026-10-09 13:18 实测「窗口≈池（129,536）」时，128K 题面
#        prefill 零进度、GPU 100% 空转 13+ 分钟 = 卡死（客户端断开也不释放 lane，只能重启进程）。
#        改回 fork 原配方的窗口尺寸（16,384/8,192），池只用来提供自由页。
#     —— 实测 runtime 4.42 GiB / free 2.36 GiB（GPU0 20 GB 卡）
#   主机层 10240 MiB：池外最多 4,144 页×1.146 MB ≈ 4.75 GiB，预留 10 GiB（按需触页）
#   前置：GPU0 归本引擎（生产 ninfer / watchdog 已 disable）；RAM 余量随 strata 波动
#
#   ★★ 两个"未解决"缺陷的绕法（fork 自己的 docs/06-Bug手册.md §1.1 / §1.2）——本档的两条设计依据：
#   §1.2（worker 崩 + 全 503 不自愈，/v1/models 仍 200）：绕法 = **客户端 max_tokens ≤ 池 token 数**。
#     2026-10-09 12:49 本机实测崩过：req#37（Hermes，tools 39，max output 131,072）⇒ 池当时只有 17,920，
#     抛 `active KV snapshot page ownership is not ordered`（kv_store.h:1513）。故池抬到 131,072 且
#     MAXTOK=131072（≤ 池）。**若客户端显式传 >131,072 的 max_tokens，仍会复现** —— 那边也要压。
#   §1.1（正确性级，静默丢中段内容，非单调）：绕法 = **池 ≥ 题面 token 数**（题面全驻留就不离开设备池）。
#     本档池 131,072 ⇒ 题面 ≤ ~131K 可认为安全（实测 65,142 题面中段针 1/1 命中）；
#     更长题面 = 环的"尽力而为"区，**针测通过不能推广**（文档原话）。
Environment=CTX=524288
Environment=POOL=158720
Environment=HOSTKV=10240
Environment=ROPEYARN=1
Environment=DSS=10   # 10 份会话检查点（每份 ≈115 MiB 显存）
Environment=HOSTSLOTS=4
Environment=PRIVCONT=8
Environment=MAXTOK=131072
Environment=LEASE=1
Environment=NINFER_KV_WINDOW=16384
Environment=NINFER_KV_RETRIEVE=8192
Environment=NINFER_KV_RING=1
Environment=NINFER_HOST_PAGEABLE=1
Environment=NINFER_KV_REUSE_HOSTBACKED=1
