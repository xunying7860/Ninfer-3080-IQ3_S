[Service]
# 512K 档（2026-10-09 用户定案）：逻辑上下文 512K + KVMem 环 + YaRN
#   逻辑上下文 524288（= 2× 原生 262144；--rope-yarn 会让引擎自动取 factor = ctx/native = 2.0）
#   设备池 280 页（17,920 token）= 窗口 16384/64 + 预填块 1024/64 + 8 余量（fork 文档配方）
#   主机层 10240 MiB：5112 页×1.146 MB ≈ 9.07 GiB，预留 10 GiB（按需触页，非一次性驻留）
#   前置：GPU0 归本引擎（生产 ninfer / watchdog 已 disable）；RAM 余量随 strata 波动，见报告 §15
Environment=CTX=524288
Environment=POOL=17920
Environment=HOSTKV=10240
Environment=ROPEYARN=1
Environment=DSS=1
Environment=NINFER_KV_WINDOW=16384
Environment=NINFER_KV_RETRIEVE=8192
Environment=NINFER_KV_RING=1
Environment=NINFER_HOST_PAGEABLE=1
Environment=NINFER_KV_REUSE_HOSTBACKED=1
