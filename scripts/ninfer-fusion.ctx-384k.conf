[Service]
# 384K 档（2026-10-09 用户定案，从 512K 下调）：逻辑上下文 384K + KVMem 环 + YaRN
#   逻辑上下文 393216（= 1.5× 原生 262144；`--rope-yarn` 让引擎自动取 factor = ctx/native = 1.5）
#   设备池 **158,720 token（2,480 页）**· 窗口 **16,384（256 页）**· 检索 8,192（128 页）
#     —— 池 2,480 页是 2026-10-09 14:43「尽量吃满显存」探出来的边界（DSS=10 时 free 907.7 MiB，GPU0 96.4%）：
#        硬底在 ~837 MiB（实测 free 837 MiB 时 warmup `cudaMalloc` OOM）。
#     —— ★ 窗口必须保持小：2026-10-09 13:18 实测「窗口≈池（129,536）」时 128K 题面 prefill
#        零进度、GPU 100% 空转 13+ 分钟 = 卡死（客户端断开也不释放 lane，只能重启）。
#        故窗口用 fork 原配方尺寸（16,384/8,192），池只负责提供自由页。
#     —— 实测 runtime 5.89 GiB / free 907.7 MiB（GPU0 20 GB 卡）
#   前置：GPU0 归本引擎（生产 ninfer / watchdog 已 disable）；RAM 余量随 strata arena(47 GiB) 波动
#
#   ── 主机层 guard 账（每次改 CTX/POOL 都要重算）────────────────────────────────
#   guard: host_pages + pool_pages ≥ logical_pages；主机页 = 1.146 MB = 64 token
#   384K: 逻辑 6,144 页 − 池 2,480 页 = 3,664 页 × 1.146 MB = 4.20 GiB 是硬需求
#   HOSTKV=5120 MiB → 4,467 主机页 + 2,480 池页 = 6,947 ≥ 6,144 ✓（余 803 页）
#   ★ 别过配：512K 档曾给 10 GiB（硬需 6.54 GiB），被触页后白占 3.5 GiB RAM
#     ⇒ x99 上 available 一度压到 56 MB。降到 8 GiB 后 available 回到 12.5 GiB。
#
#   ★★ 两个"未解决"缺陷的绕法（fork 自己的 docs/06-Bug手册.md §1.1 / §1.2）——本档设计依据：
#   §1.2（worker 崩 + 全 503 不自愈，/v1/models 仍 200）：绕法 = **客户端 max_tokens ≤ 池 token 数**。
#     2026-10-09 12:49 实测崩过：req#37（Hermes，tools 39，max output 131,072）当时池只有 17,920，
#     抛 `active KV snapshot page ownership is not ordered`（kv_store.h:1513）。故池抬到 158,720 且
#     MAXTOK=131,072（≤ 池）。**客户端显式传 >131,072 仍会复现** —— 那边也要压。
#   §1.1（正确性级，静默丢中段内容，非单调）：绕法 = **池 ≥ 题面 token 数**（题面全驻留不离开设备池）。
#     本档池 158,720 ⇒ 题面 ≤ ~158K 可认为安全（实测 65K/94K/114K/128K/149K/400K 中段针全中）；
#     更长题面 = 环的"尽力而为"区，**针测通过不能推广**（文档原话）。
Environment=CTX=393216
Environment=POOL=158720
Environment=HOSTKV=5120
Environment=ROPEYARN=1
#   10 份会话检查点；每份 ≈115 MiB 显存（★systemd 的 Environment= 不支持行内注释：
#   写成 Environment=DSS=10  # 注释 会让 systemd 把注释词当环境变量解析并在 journal 刷警告）
Environment=DSS=10
Environment=HOSTSLOTS=4
Environment=PRIVCONT=8
Environment=MAXTOK=131072
#   --kv-lease-growth=1（run.sh 的 LEASE）：输出页只预留 4,096 token 窗口按需扩展
#   --recover-invariant-failures（run.sh 的 RECOVER，默认 1）：内部不变量破坏时**只丢在途请求、引擎继续服务**
#     （今天 4 个崩溃签名全属 failure_class.h 的 std::logic_error→Invariant 类，默认会崩掉整机）
Environment=LEASE=1
# 引擎自带的自愈开关（源码 engine_core.h:2336 注释明写）：worker 崩后 `failed_` 会让该实例
# "HTTP 还活着但什么都不能跑"（僵尸 503）；置 1 让进程以 code 3 退出 ⇒ 交给 systemd
# Restart=on-failure 自动拉起（约 2.5 min），而不是等人发现"挂了"。
Environment=NINFER_EXIT_ON_WORKER_CRASH=1
Environment=NINFER_KV_WINDOW=16384
Environment=NINFER_KV_RETRIEVE=8192
Environment=NINFER_KV_RING=1
Environment=NINFER_HOST_PAGEABLE=1
Environment=NINFER_KV_REUSE_HOSTBACKED=1
